<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{% block title %}{{ title }}{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231a6fe0' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M4 6c0-1.1 3.6-2 8-2s8 .9 8 2-3.6 2-8 2-8-.9-8-2Z'/%3E%3Cpath d='m4 6 1.6 12.4C5.8 19.9 8.6 21 12 21s6.2-1.1 6.4-2.6L20 6'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #f4f5f7;
            --surface: #ffffff;
            --surface-2: #f8f9fb;
            --border: #e3e6eb;
            --text: #121826;
            --muted: #5b6676;
            --faint: #8a94a3;
            --accent: #1a6fe0;
            --accent-soft: rgba(26, 111, 224, .1);
            --row-hover: #f5f8fe;
            --glow: rgba(26, 111, 224, .12);
            --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 12px 32px -16px rgba(16, 24, 40, .18);
            --folder: #d99a0b;
            --code: #16a34a;
            --archive: #8b5cf6;
            --image: #db2777;
            --doc: #2563eb;
            --file: #64748b;
            --radius: 14px;
            --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0c1017;
                --surface: #131923;
                --surface-2: #171e2a;
                --border: #252e3c;
                --text: #e6e9ef;
                --muted: #a0a9b6;
                --faint: #6f7987;
                --accent: #6aa5ff;
                --accent-soft: rgba(106, 165, 255, .13);
                --row-hover: #18202d;
                --glow: rgba(106, 165, 255, .1);
                --shadow: 0 12px 32px -16px rgba(0, 0, 0, .6);
                --folder: #f2b84b;
                --code: #4ade80;
                --archive: #a78bfa;
                --image: #f472b6;
                --doc: #60a5fa;
                --file: #94a3b8;
            }
        }

        *, *::before, *::after { box-sizing: border-box; }

        body {
            margin: 0;
            font: 15px/1.5 var(--sans);
            color: var(--text);
            background: radial-gradient(1100px 380px at 50% -160px, var(--glow), transparent 70%) no-repeat, var(--bg);
            -webkit-font-smoothing: antialiased;
        }

        a { color: inherit; text-decoration: none; }

        .page {
            max-width: 1080px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 40px 16px 28px;
            display: flex;
            flex-direction: column;
        }

        /* ---------- Header ---------- */
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font: 600 12px/1 var(--mono);
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .brand svg { width: 18px; height: 18px; color: var(--accent); }

        h1 {
            margin: 14px 0 12px;
            font-size: clamp(1.55rem, 1.1rem + 1.8vw, 2.25rem);
            font-weight: 750;
            line-height: 1.15;
            letter-spacing: -.02em;
            text-wrap: balance;
        }

        h1 a { transition: color .15s; }
        h1 a:hover { color: var(--accent); }

        .meta {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 16px;
            font-size: 13.5px;
            color: var(--muted);
        }

        .path {
            padding: 4px 10px;
            font: 12.5px/1.4 var(--mono);
            color: var(--muted);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 999px;
            overflow-wrap: anywhere;
        }

        main { flex: 1; margin-top: 28px; }

        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        /* ---------- Toolbar ---------- */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 12px 12px 14px;
            border-bottom: 1px solid var(--border);
        }

        .crumbs {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 2px;
            min-width: 0;
            font-size: 14px;
        }

        .crumbs a, .crumbs span[aria-current] { padding: 4px 8px; border-radius: 8px; overflow-wrap: anywhere; }
        .crumbs a { color: var(--muted); transition: background-color .15s, color .15s; }
        .crumbs a:hover { color: var(--accent); background: var(--accent-soft); }
        .crumbs [aria-current] { font-weight: 600; color: var(--text); }
        .crumbs .sep { color: var(--faint); }
        .crumbs .home { display: inline-flex; padding: 6px; }
        .crumbs .home svg { display: block; width: 17px; height: 17px; }

        .search { position: relative; display: flex; align-items: center; flex: 0 1 260px; }
        .search > svg { position: absolute; left: 10px; width: 16px; height: 16px; color: var(--faint); pointer-events: none; }

        .search input {
            width: 100%;
            padding: 7px 34px 7px 32px;
            font: inherit;
            font-size: 14px;
            color: var(--text);
            background: var(--surface-2);
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }

        .search input::placeholder { color: var(--faint); }
        .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

        .search kbd {
            position: absolute;
            right: 8px;
            padding: 3px 6px;
            font: 11px/1 var(--mono);
            color: var(--faint);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 5px;
            pointer-events: none;
        }

        .search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }

        /* ---------- Table ---------- */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }

        th {
            padding: 10px 16px;
            font-size: 11.5px;
            font-weight: 600;
            letter-spacing: .06em;
            text-align: left;
            text-transform: uppercase;
            white-space: nowrap;
            color: var(--faint);
            background: var(--surface-2);
            border-bottom: 1px solid var(--border);
        }

        th button {
            all: unset;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            transition: color .15s;
        }

        th button:hover, th[aria-sort] button { color: var(--text); }
        th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
        th .sort-icon { width: 13px; height: 13px; opacity: 0; transition: transform .15s; }
        th[aria-sort] .sort-icon { opacity: 1; color: var(--accent); }
        th[aria-sort="descending"] .sort-icon { transform: rotate(180deg); }

        td { padding: 9px 16px; vertical-align: middle; border-top: 1px solid var(--border); }
        thead + tbody tr:first-child td { border-top: 0; }
        tbody tr { transition: background-color .12s; }
        tbody tr:not(.empty):hover { background: var(--row-hover); }

        .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
        th.num button { flex-direction: row-reverse; }
        .date { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
        .dim { color: var(--faint); }

        .entry { display: flex; align-items: center; gap: 12px; min-width: 0; font-weight: 500; }
        .entry .text { display: flex; flex-direction: column; min-width: 0; }
        .entry .label { overflow-wrap: anywhere; transition: color .12s; }
        .entry:hover .label { color: var(--accent); }
        .entry:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 8px; }
        .is-folder .label { font-weight: 600; }
        .up .label { color: var(--muted); }

        .icon {
            flex: none;
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            border-radius: 9px;
            color: var(--c);
            background: var(--surface-2);
            background: color-mix(in srgb, var(--c) 13%, transparent);
        }

        .icon svg { width: 18px; height: 18px; }
        .k-folder { --c: var(--folder); }
        .k-code { --c: var(--code); }
        .k-archive { --c: var(--archive); }
        .k-image { --c: var(--image); }
        .k-doc { --c: var(--doc); }
        .k-file, .k-up { --c: var(--file); }

        svg.i { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

        .actions { width: 1%; padding-left: 0; text-align: right; }

        .copy {
            all: unset;
            display: inline-grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            color: var(--faint);
            cursor: pointer;
            opacity: 0;
            transition: opacity .12s, background-color .12s, color .12s;
        }

        .copy svg { width: 16px; height: 16px; }
        tr:hover .copy, .copy:focus-visible, .copy.copied { opacity: 1; }
        .copy:hover { color: var(--accent); background: var(--accent-soft); }
        .copy:focus-visible { outline: 2px solid var(--accent); }
        .copy .i-check, .copy.copied .i-copy { display: none; }
        .copy.copied .i-check { display: block; }
        .copy.copied { color: var(--code); }

        @media (hover: none) { .copy { opacity: 1; } }

        .empty td { padding: 48px 16px; text-align: center; color: var(--muted); }
        .mobile-meta { display: none; }

        /* ---------- Error ---------- */
        .error { padding: 56px 24px; text-align: center; }
        .error .code { margin: 0; font: 700 64px/1 var(--mono); letter-spacing: -.04em; color: var(--accent); }
        .error p { margin: 12px 0 28px; color: var(--muted); }

        .button {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 16px;
            font-weight: 600;
            font-size: 14px;
            color: #fff;
            background: var(--accent);
            border-radius: 10px;
            transition: filter .15s;
        }

        .button:hover { filter: brightness(1.08); }
        .button svg { width: 16px; height: 16px; }

        /* ---------- Footer ---------- */
        footer {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 8px 16px;
            margin-top: 28px;
            font-size: 13px;
            color: var(--faint);
        }

        footer a { color: var(--muted); transition: color .15s; }
        footer a:hover { color: var(--accent); }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 760px) {
            .col-created { display: none; }
        }

        @media (max-width: 560px) {
            .page { padding-top: 28px; }
            .col-updated { display: none; }
            .mobile-meta { display: block; font-size: 12.5px; font-weight: 400; color: var(--faint); }
            .path { border-radius: 10px; }
            table { font-size: 13.5px; }
            .search { flex-basis: 100%; }
            th, td { padding-left: 12px; padding-right: 12px; }
            .actions { padding-left: 0; }
        }
    </style>
</head>
<body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
        <symbol id="i-bucket" viewBox="0 0 24 24"><path d="M4 6c0-1.1 3.6-2 8-2s8 .9 8 2-3.6 2-8 2-8-.9-8-2Z"/><path d="m4 6 1.6 12.4C5.8 19.9 8.6 21 12 21s6.2-1.1 6.4-2.6L20 6"/></symbol>
        <symbol id="i-home" viewBox="0 0 24 24"><path d="M3.5 10.5 12 3.5l8.5 7"/><path d="M5.5 9v11h4.5v-6h4v6h4.5V9"/></symbol>
        <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5Z"/></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8Z"/><path d="M14 3v5h5"/></symbol>
        <symbol id="i-code" viewBox="0 0 24 24"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8Z"/><path d="M14 3v5h5"/><path d="m10 12.5-2 2 2 2"/><path d="m14 12.5 2 2-2 2"/></symbol>
        <symbol id="i-archive" viewBox="0 0 24 24"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8Z"/><path d="M14 3v5h5"/><path d="M10 6h1.5M10 9h1.5M10 12h1.5"/><rect x="9.25" y="14.5" width="3" height="3.5" rx=".8"/></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8Z"/><path d="M14 3v5h5"/><circle cx="10" cy="12" r="1.5"/><path d="m5.5 19 5-4.5 2.5 2 1.5-1.5 4 3.5"/></symbol>
        <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H7.5A2.5 2.5 0 0 0 5 5.5v13A2.5 2.5 0 0 0 7.5 21h9a2.5 2.5 0 0 0 2.5-2.5V8Z"/><path d="M14 3v5h5"/><path d="M8.5 13h7M8.5 16.5h5"/></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
        <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15h-.5A1.5 1.5 0 0 1 3 13.5v-9A1.5 1.5 0 0 1 4.5 3h9A1.5 1.5 0 0 1 15 4.5V5"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m7 14 5-5 5 5"/></symbol>
    </svg>

    <div class="page">
        <header>
            <span class="brand"><svg class="i"><use href="#i-bucket"/></svg>GCS Objects Viewer</span>
            <h1><a href="{{ url_for('browse') }}">{{ title }}</a></h1>
            <div class="meta">{% block meta %}{% endblock %}</div>
        </header>

        <main>{% block content %}{% endblock %}</main>

        <footer>
            <a href="https://github.com/Nem-developing/google-cloud-storage-objects-viewer">Google Cloud Storage Objects Viewer · v{{ version }}</a>
            <span>Réalisé par <a href="https://nehemiebarkia.fr">BARKIA Néhémie</a></span>
        </footer>
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
